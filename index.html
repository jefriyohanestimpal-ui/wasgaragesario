<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Under Construction 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    perspective: 1200px;
  }

  /* Title */
  .title {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd500;
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 6px;
    text-shadow: 0 0 30px rgba(255, 213, 0, 0.8), 3px 3px 0 #000;
    animation: flicker 2s infinite;
    z-index: 10;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
    52% { opacity: 0.4; }
    54% { opacity: 1; }
  }

  /* Scene */
  .scene {
    position: relative;
    width: 700px;
    height: 600px;
    transform-style: preserve-3d;
    transform: rotateX(15deg);
  }

  /* Floor */
  .floor {
    position: absolute;
    width: 900px;
    height: 900px;
    left: -100px;
    top: 250px;
    background: 
      linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px) 0 0 / 50px 50px,
      linear-gradient(0deg, rgba(255,255,255,0.06) 1px, transparent 1px) 0 0 / 50px 50px,
      radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a1a 80%);
    transform: rotateX(75deg) translateZ(-150px);
    box-shadow: 0 0 100px rgba(0,0,0,0.9);
  }

  /* Server Box */
  .server {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) translateZ(0);
    width: 200px;
    height: 340px;
    transform-style: preserve-3d;
    animation: serverFloat 5s ease-in-out infinite;
  }

  @keyframes serverFloat {
    0%, 100% { transform: translate(-50%, -50%) translateZ(0) rotateY(-10deg); }
    50% { transform: translate(-50%, -50%) translateZ(20px) rotateY(-8deg); }
  }

  .server-face {
    position: absolute;
    background: linear-gradient(135deg, #2c3e50, #1a252f);
    border: 3px solid #0a0a0a;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
  }

  .server-front {
    width: 200px;
    height: 340px;
    transform: translateZ(100px);
    background: linear-gradient(180deg, #34495e 0%, #1a252f 100%);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .server-back {
    width: 200px;
    height: 340px;
    transform: translateZ(-100px) rotateY(180deg);
    background: #1a1a2a;
  }

  .server-left {
    width: 200px;
    height: 340px;
    transform: rotateY(-90deg) translateZ(100px);
    background: linear-gradient(90deg, #1a252f, #2c3e50);
  }

  .server-right {
    width: 200px;
    height: 340px;
    transform: rotateY(90deg) translateZ(100px);
    background: linear-gradient(90deg, #2c3e50, #1a252f);
  }

  .server-top {
    width: 200px;
    height: 200px;
    transform: rotateX(90deg) translateZ(170px);
    background: #2c3e50;
  }

  .server-bottom {
    width: 200px;
    height: 200px;
    transform: rotateX(-90deg) translateZ(170px);
    background: #0a0a0a;
  }

  /* Server slots */
  .slot {
    height: 32px;
    background: #0a0a0a;
    border: 2px solid #000;
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
    position: relative;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
  }

  /* LED dengan animasi ganti warna */
  .led {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 15px currentColor, 0 0 30px currentColor;
    animation: colorShift1 3s infinite;
  }

  .led.large {
    width: 14px;
    height: 14px;
    box-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor;
  }

  .led.s1 { animation: colorShift1 2s infinite; }
  .led.s2 { animation: colorShift2 2.5s infinite; animation-delay: 0.3s; }
  .led.s3 { animation: colorShift3 1.8s infinite; animation-delay: 0.6s; }
  .led.s4 { animation: colorShift4 2.2s infinite; animation-delay: 0.9s; }
  .led.s5 { animation: colorShift5 2.8s infinite; animation-delay: 1.2s; }
  .led.s6 { animation: colorShift6 1.5s infinite; animation-delay: 0.4s; }
  .led.s7 { animation: colorShift7 3.2s infinite; animation-delay: 0.7s; }
  .led.s8 { animation: colorShift8 2.1s infinite; animation-delay: 1s; }

  @keyframes colorShift1 {
    0%, 100% { background: #00ff88; color: #00ff88; }
    25% { background: #00aaff; color: #00aaff; }
    50% { background: #ff3344; color: #ff3344; }
    75% { background: #ffd500; color: #ffd500; }
  }

  @keyframes colorShift2 {
    0%, 100% { background: #ff3344; color: #ff3344; }
    25% { background: #ffd500; color: #ffd500; }
    50% { background: #00ff88; color: #00ff88; }
    75% { background: #aa00ff; color: #aa00ff; }
  }

  @keyframes colorShift3 {
    0%, 100% { background: #00aaff; color: #00aaff; }
    25% { background: #aa00ff; color: #aa00ff; }
    50% { background: #ff3344; color: #ff3344; }
    75% { background: #00ff88; color: #00ff88; }
  }

  @keyframes colorShift4 {
    0%, 100% { background: #ffd500; color: #ffd500; }
    25% { background: #00ff88; color: #00ff88; }
    50% { background: #00aaff; color: #00aaff; }
    75% { background: #ff3344; color: #ff3344; }
  }

  @keyframes colorShift5 {
    0%, 100% { background: #aa00ff; color: #aa00ff; }
    25% { background: #ff3344; color: #ff3344; }
    50% { background: #ffd500; color: #ffd500; }
    75% { background: #00aaff; color: #00aaff; }
  }

  @keyframes colorShift6 {
    0%, 100% { background: #00ff88; color: #00ff88; }
    33% { background: #ff3344; color: #ff3344; }
    66% { background: #00aaff; color: #00aaff; }
  }

  @keyframes colorShift7 {
    0%, 100% { background: #ff3344; color: #ff3344; }
    33% { background: #00ff88; color: #00ff88; }
    66% { background: #ffd500; color: #ffd500; }
  }

  @keyframes colorShift8 {
    0%, 100% { background: #00aaff; color: #00aaff; }
    33% { background: #ffd500; color: #ffd500; }
    66% { background: #aa00ff; color: #aa00ff; }
  }

  .slot-lines {
    flex: 1;
    height: 6px;
    background: repeating-linear-gradient(90deg, #444 0 4px, #222 4px 8px);
    border-radius: 2px;
  }

  /* LED Strip di sisi server */
  .led-strip {
    position: absolute;
    width: 8px;
    height: 300px;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    z-index: 5;
  }

  .led-strip.left { left: -15px; }
  .led-strip.right { right: -15px; }

  .led-strip .led {
    width: 8px;
    height: 8px;
  }

  /* Broken panel */
  .broken {
    position: absolute;
    right: -8px;
    top: 100px;
    width: 90px;
    height: 70px;
    background: linear-gradient(135deg, #34495e, #1a252f);
    border: 3px solid #000;
    transform: rotateY(-40deg) rotateZ(10deg);
    transform-origin: left center;
    animation: panelSwing 4s ease-in-out infinite;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }
  @keyframes panelSwing {
    0%, 100% { transform: rotateY(-40deg) rotateZ(10deg); }
    50% { transform: rotateY(-30deg) rotateZ(6deg); }
  }

  /* Wires */
  .wires {
    position: absolute;
    right: 15px;
    top: 115px;
    width: 50px;
    height: 50px;
    z-index: 2;
  }
  .wire {
    position: absolute;
    width: 4px;
    height: 40px;
    border-radius: 2px;
    animation: wireWiggle 1.2s ease-in-out infinite;
  }
  .wire:nth-child(1) { left: 5px; background: #ff3344; animation-delay: 0s; }
  .wire:nth-child(2) { left: 18px; background: #ffd500; animation-delay: 0.25s; }
  .wire:nth-child(3) { left: 31px; background: #00aaff; animation-delay: 0.5s; }
  .wire:nth-child(4) { left: 44px; background: #00ff88; animation-delay: 0.75s; }

  @keyframes wireWiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  /* Sparks */
  .sparks {
    position: absolute;
    right: 25px;
    top: 130px;
    width: 50px;
    height: 50px;
    z-index: 5;
  }
  .spark {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #ffd500;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff6b00, 0 0 25px #ffd500;
    animation: sparkFly 1.2s ease-out infinite;
  }
  .spark:nth-child(1) { animation-delay: 0s; }
  .spark:nth-child(2) { animation-delay: 0.24s; }
  .spark:nth-child(3) { animation-delay: 0.48s; }
  .spark:nth-child(4) { animation-delay: 0.72s; }
  .spark:nth-child(5) { animation-delay: 0.96s; }

  @keyframes sparkFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx, 35px), var(--dy, -50px)) scale(0); opacity: 0; }
  }
  .spark:nth-child(1) { --dx: 35px; --dy: -35px; }
  .spark:nth-child(2) { --dx: -30px; --dy: -55px; }
  .spark:nth-child(3) { --dx: 50px; --dy: -15px; }
  .spark:nth-child(4) { --dx: -45px; --dy: -30px; }
  .spark:nth-child(5) { --dx: 25px; --dy: -60px; }

  /* Caution tape */
  .tape {
    position: absolute;
    bottom: 80px;
    left: 60px;
    right: 60px;
    height: 30px;
    background: repeating-linear-gradient(
      -45deg,
      #ffd500 0 25px,
      #000 25px 50px
    );
    transform: translateZ(150px) rotateX(-5deg);
    border: 3px solid #000;
    opacity: 0.95;
    animation: tapeSway 3.5s ease-in-out infinite;
  }
  @keyframes tapeSway {
    0%, 100% { transform: translateZ(150px) rotateX(-5deg) translateY(0); }
    50% { transform: translateZ(150px) rotateX(-5deg) translateY(-4px); }
  }

  /* Status text */
  .status {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ff88;
    font-size: 16px;
    letter-spacing: 3px;
    text-shadow: 0 0 15px #00ff88;
    animation: statusBlink 1.2s infinite;
  }
  @keyframes statusBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .status::before { content: '> '; }
  .status::after { content: ' _'; animation: cursor 0.8s infinite; }
  @keyframes cursor {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* Ambient glow */
  .glow {
    position: absolute;
    width: 400px;
    height: 400px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 213, 0, 0.25) 0%, transparent 70%);
    pointer-events: none;
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* LED glow */
  .led-glow {
    position: absolute;
    width: 250px;
    height: 350px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) translateZ(50px);
    background: radial-gradient(ellipse, rgba(0, 255, 136, 0.15) 0%, transparent 60%);
    pointer-events: none;
    animation: ledGlow 2s ease-in-out infinite;
  }
  @keyframes ledGlow {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
  }
</style>
</head>
<body>

<div class="title">UNDER CONSTRUCTION</div>

<div class="scene">
  <div class="glow"></div>
  <div class="led-glow"></div>
  <div class="floor"></div>

  <!-- Server Box -->
  <div class="server">
    <!-- LED Strip kiri -->
    <div class="led-strip left">
      <div class="led large s1"></div>
      <div class="led large s2"></div>
      <div class="led large s3"></div>
      <div class="led large s4"></div>
      <div class="led large s5"></div>
      <div class="led large s6"></div>
      <div class="led large s7"></div>
      <div class="led large s8"></div>
    </div>

    <!-- LED Strip kanan -->
    <div class="led-strip right">
      <div class="led large s5"></div>
      <div class="led large s6"></div>
      <div class="led large s7"></div>
      <div class="led large s8"></div>
      <div class="led large s1"></div>
      <div class="led large s2"></div>
      <div class="led large s3"></div>
      <div class="led large s4"></div>
    </div>

    <div class="server-face server-front">
      <div class="slot">
        <div class="led s1"></div>
        <div class="led s2"></div>
        <div class="led s3"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led s4"></div>
        <div class="led s5"></div>
        <div class="led s6"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led s7"></div>
        <div class="led s8"></div>
        <div class="led s1"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led s2"></div>
        <div class="led s3"></div>
        <div class="led s4"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led s5"></div>
        <div class="led s6"></div>
        <div class="led s7"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led s8"></div>
        <div class="led s1"></div>
        <div class="led s2"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led s3"></div>
        <div class="led s4"></div>
        <div class="led s5"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led s6"></div>
        <div class="led s7"></div>
        <div class="led s8"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led s1"></div>
        <div class="led s2"></div>
        <div class="led s3"></div>
        <div class="slot-lines"></div>
      </div>
    </div>
    <div class="server-face server-back"></div>
    <div class="server-face server-left"></div>
    <div class="server-face server-right"></div>
    <div class="server-face server-top"></div>
    <div class="server-face server-bottom"></div>

    <!-- Broken panel -->
    <div class="broken"></div>
    <div class="wires">
      <div class="wire"></div>
      <div class="wire"></div>
      <div class="wire"></div>
      <div class="wire"></div>
    </div>
    <div class="sparks">
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
    </div>
  </div>

  <!-- Caution tape -->
  <div class="tape"></div>
</div>

<div class="status">SERVER MAINTENANCE IN PROGRESS</div>

</body>
</html>
