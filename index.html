<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Under Construction 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    perspective: 1200px;
  }

  /* Title */
  .title {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd500;
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255, 213, 0, 0.6), 3px 3px 0 #000;
    animation: flicker 2s infinite;
    z-index: 10;
  }
  .title::before { content: "⚠ "; color: #ff6b00; }
  .title::after { content: " ⚠"; color: #ff6b00; }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
    52% { opacity: 0.4; }
    54% { opacity: 1; }
  }

  /* Scene */
  .scene {
    position: relative;
    width: 600px;
    height: 500px;
    transform-style: preserve-3d;
    transform: rotateX(15deg);
  }

  /* Floor */
  .floor {
    position: absolute;
    width: 800px;
    height: 800px;
    left: -100px;
    top: 200px;
    background: 
      linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(0deg, rgba(255,255,255,0.08) 1px, transparent 1px) 0 0 / 40px 40px,
      radial-gradient(ellipse at center, #2a2a3e 0%, #0a0a1a 80%);
    transform: rotateX(75deg) translateZ(-100px);
    box-shadow: 0 0 80px rgba(0,0,0,0.8);
  }

  /* Server Box */
  .server {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) translateZ(0);
    width: 160px;
    height: 260px;
    transform-style: preserve-3d;
    animation: serverWobble 4s ease-in-out infinite;
  }

  @keyframes serverWobble {
    0%, 100% { transform: translate(-50%, -50%) translateZ(0) rotateY(-15deg); }
    50% { transform: translate(-50%, -50%) translateZ(0) rotateY(-10deg); }
  }

  .server-face {
    position: absolute;
    background: linear-gradient(135deg, #2c3e50, #1a252f);
    border: 2px solid #0a0a0a;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
  }

  .server-front {
    width: 160px;
    height: 260px;
    transform: translateZ(80px);
    background: linear-gradient(180deg, #34495e 0%, #1a252f 100%);
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .server-back {
    width: 160px;
    height: 260px;
    transform: translateZ(-80px) rotateY(180deg);
    background: #1a1a2a;
  }

  .server-left {
    width: 160px;
    height: 260px;
    transform: rotateY(-90deg) translateZ(80px);
    background: linear-gradient(90deg, #1a252f, #2c3e50);
  }

  .server-right {
    width: 160px;
    height: 260px;
    transform: rotateY(90deg) translateZ(80px);
    background: linear-gradient(90deg, #2c3e50, #1a252f);
  }

  .server-top {
    width: 160px;
    height: 160px;
    transform: rotateX(90deg) translateZ(130px);
    background: #2c3e50;
  }

  .server-bottom {
    width: 160px;
    height: 160px;
    transform: rotateX(-90deg) translateZ(130px);
    background: #0a0a0a;
  }

  /* Server slots */
  .slot {
    height: 28px;
    background: #0a0a0a;
    border: 1px solid #000;
    border-radius: 3px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 6px;
    position: relative;
  }

  .led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px currentColor;
    animation: blink 1.5s infinite;
  }
  .led.red { background: #ff3344; color: #ff3344; animation: blink-fast 0.4s infinite; }
  .led.blue { background: #00aaff; color: #00aaff; animation: blink 2s infinite; }
  .led.off { background: #333; box-shadow: none; animation: none; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes blink-fast {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.1; }
  }

  .slot-lines {
    flex: 1;
    height: 4px;
    background: repeating-linear-gradient(90deg, #444 0 3px, #222 3px 6px);
    border-radius: 1px;
  }

  /* Broken panel */
  .broken {
    position: absolute;
    right: -5px;
    top: 80px;
    width: 70px;
    height: 50px;
    background: linear-gradient(135deg, #34495e, #1a252f);
    border: 2px solid #000;
    transform: rotateY(-35deg) rotateZ(8deg);
    transform-origin: left center;
    animation: panelSwing 3s ease-in-out infinite;
  }
  @keyframes panelSwing {
    0%, 100% { transform: rotateY(-35deg) rotateZ(8deg); }
    50% { transform: rotateY(-25deg) rotateZ(5deg); }
  }

  /* Wires */
  .wires {
    position: absolute;
    right: 10px;
    top: 90px;
    width: 40px;
    height: 40px;
    z-index: 2;
  }
  .wire {
    position: absolute;
    width: 3px;
    height: 30px;
    border-radius: 2px;
    animation: wireWiggle 1s ease-in-out infinite;
  }
  .wire:nth-child(1) { left: 5px; background: #ff3344; animation-delay: 0s; }
  .wire:nth-child(2) { left: 15px; background: #ffd500; animation-delay: 0.2s; }
  .wire:nth-child(3) { left: 25px; background: #00aaff; animation-delay: 0.4s; }
  .wire:nth-child(4) { left: 35px; background: #00ff88; animation-delay: 0.6s; }

  @keyframes wireWiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* Sparks */
  .sparks {
    position: absolute;
    right: 20px;
    top: 100px;
    width: 40px;
    height: 40px;
    z-index: 5;
  }
  .spark {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ffd500;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff6b00, 0 0 20px #ffd500;
    animation: sparkFly 1s ease-out infinite;
  }
  .spark:nth-child(1) { animation-delay: 0s; }
  .spark:nth-child(2) { animation-delay: 0.2s; }
  .spark:nth-child(3) { animation-delay: 0.4s; }
  .spark:nth-child(4) { animation-delay: 0.6s; }
  .spark:nth-child(5) { animation-delay: 0.8s; }

  @keyframes sparkFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx, 30px), var(--dy, -40px)) scale(0); opacity: 0; }
  }
  .spark:nth-child(1) { --dx: 30px; --dy: -30px; }
  .spark:nth-child(2) { --dx: -25px; --dy: -45px; }
  .spark:nth-child(3) { --dx: 40px; --dy: -10px; }
  .spark:nth-child(4) { --dx: -35px; --dy: -25px; }
  .spark:nth-child(5) { --dx: 20px; --dy: -50px; }

  /* Worker */
  .worker {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-180px, -60px) translateZ(60px);
    width: 100px;
    height: 200px;
    transform-style: preserve-3d;
    animation: workerBob 2s ease-in-out infinite;
  }
  @keyframes workerBob {
    0%, 100% { transform: translate(-180px, -60px) translateZ(60px) translateY(0); }
    50% { transform: translate(-180px, -60px) translateZ(60px) translateY(-5px); }
  }

  /* Head */
  .head {
    position: absolute;
    top: 0;
    left: 30px;
    width: 40px;
    height: 40px;
    background: #f4c89a;
    border-radius: 50%;
    border: 2px solid #000;
    z-index: 3;
  }
  .head::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 8px;
    width: 6px;
    height: 6px;
    background: #000;
    border-radius: 50%;
    box-shadow: 18px 0 0 #000;
  }

  /* Hard hat */
  .hat {
    position: absolute;
    top: -12px;
    left: 22px;
    width: 56px;
    height: 28px;
    background: linear-gradient(180deg, #ffd500 0%, #ff9500 100%);
    border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
    border: 2px solid #000;
    z-index: 4;
  }
  .hat::before {
    content: '';
    position: absolute;
    bottom: -6px;
    left: -4px;
    width: 64px;
    height: 10px;
    background: #ff9500;
    border-radius: 50%;
    border: 2px solid #000;
  }

  /* Body */
  .body {
    position: absolute;
    top: 45px;
    left: 20px;
    width: 60px;
    height: 80px;
    background: linear-gradient(180deg, #ff6b00 0%, #cc4400 100%);
    border: 2px solid #000;
    border-radius: 8px;
    z-index: 2;
  }
  .body::before {
    content: '';
    position: absolute;
    top: 20px;
    left: 0;
    width: 100%;
    height: 8px;
    background: #ffd500;
    border-top: 2px solid #000;
    border-bottom: 2px solid #000;
    box-shadow: 0 25px 0 0 #ffd500, 0 23px 0 2px #000, 0 27px 0 2px #000;
  }

  /* Legs */
  .legs {
    position: absolute;
    top: 120px;
    left: 25px;
    width: 50px;
    height: 60px;
    z-index: 1;
  }
  .leg {
    position: absolute;
    width: 20px;
    height: 55px;
    background: linear-gradient(180deg, #2c5282 0%, #1a365d 100%);
    border: 2px solid #000;
    border-radius: 4px;
  }
  .leg.left { left: 0; animation: legL 1s ease-in-out infinite; }
  .leg.right { right: 0; animation: legR 1s ease-in-out infinite; }
  @keyframes legL {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }
  @keyframes legR {
    0%, 100% { transform: rotate(5deg); }
    50% { transform: rotate(-5deg); }
  }

  /* Arms */
  .arm {
    position: absolute;
    top: 55px;
    width: 18px;
    height: 60px;
    background: linear-gradient(180deg, #ff6b00 0%, #cc4400 100%);
    border: 2px solid #000;
    border-radius: 10px;
    transform-origin: top center;
    z-index: 3;
  }
  .arm.left {
    left: 8px;
    animation: armL 1s ease-in-out infinite;
  }
  .arm.right {
    right: -15px;
    animation: armR 1s ease-in-out infinite;
  }
  @keyframes armL {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(-30deg); }
  }
  @keyframes armR {
    0%, 100% { transform: rotate(40deg); }
    50% { transform: rotate(70deg); }
  }

  /* Wrench in right hand */
  .wrench {
    position: absolute;
    bottom: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 35px;
    background: linear-gradient(90deg, #aaa, #666);
    border: 1px solid #000;
    border-radius: 2px;
  }
  .wrench::before {
    content: '';
    position: absolute;
    top: -8px;
    left: -6px;
    width: 20px;
    height: 12px;
    background: #888;
    border: 1px solid #000;
    border-radius: 3px;
    clip-path: polygon(0 30%, 40% 30%, 40% 0, 60% 0, 60% 30%, 100% 30%, 100% 100%, 0 100%);
  }

  /* Second worker */
  .worker2 {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(80px, -40px) translateZ(60px) scaleX(-1);
    width: 100px;
    height: 200px;
    transform-style: preserve-3d;
    animation: workerBob2 2.3s ease-in-out infinite;
  }
  @keyframes workerBob2 {
    0%, 100% { transform: translate(80px, -40px) translateZ(60px) scaleX(-1) translateY(0); }
    50% { transform: translate(80px, -40px) translateZ(60px) scaleX(-1) translateY(-4px); }
  }
  .worker2 .hat { background: linear-gradient(180deg, #fff 0%, #ddd 100%); }
  .worker2 .hat::before { background: #ddd; }
  .worker2 .body { background: linear-gradient(180deg, #ffcc00 0%, #cc9900 100%); }
  .worker2 .arm { background: linear-gradient(180deg, #ffcc00 0%, #cc9900 100%); }

  /* Traffic cones */
  .cone {
    position: absolute;
    width: 30px;
    height: 50px;
    transform-style: preserve-3d;
  }
  .cone::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 30px;
    height: 50px;
    background: linear-gradient(180deg, #ff6b00 0%, #cc4400 100%);
    clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
    border: 2px solid #000;
  }
  .cone::after {
    content: '';
    position: absolute;
    bottom: 15px;
    left: 0;
    width: 30px;
    height: 8px;
    background: #fff;
    border-top: 2px solid #000;
    border-bottom: 2px solid #000;
  }
  .cone1 { left: 80px; top: 320px; transform: translateZ(100px); }
  .cone2 { right: 80px; top: 340px; transform: translateZ(80px); }
  .cone3 { left: 150px; top: 380px; transform: translateZ(150px); }

  /* Caution tape */
  .tape {
    position: absolute;
    bottom: 60px;
    left: 50px;
    right: 50px;
    height: 25px;
    background: repeating-linear-gradient(
      -45deg,
      #ffd500 0 20px,
      #000 20px 40px
    );
    transform: translateZ(120px) rotateX(-5deg);
    border: 2px solid #000;
    opacity: 0.95;
    animation: tapeSway 3s ease-in-out infinite;
  }
  @keyframes tapeSway {
    0%, 100% { transform: translateZ(120px) rotateX(-5deg) translateY(0); }
    50% { transform: translateZ(120px) rotateX(-5deg) translateY(-3px); }
  }

  /* Floating tools */
  .toolbox {
    position: absolute;
    left: 60px;
    top: 350px;
    width: 50px;
    height: 35px;
    background: linear-gradient(180deg, #c0392b 0%, #7b1e12 100%);
    border: 2px solid #000;
    border-radius: 3px;
    transform: translateZ(80px);
  }
  .toolbox::before {
    content: '';
    position: absolute;
    top: -8px;
    left: 15px;
    width: 20px;
    height: 10px;
    border: 3px solid #000;
    border-bottom: none;
    border-radius: 5px 5px 0 0;
  }

  /* Status text */
  .status {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ff88;
    font-size: 14px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #00ff88;
    animation: statusBlink 1s infinite;
  }
  @keyframes statusBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .status::before { content: '> '; }
  .status::after { content: ' _'; animation: cursor 0.8s infinite; }
  @keyframes cursor {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* Ambient glow */
  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 213, 0, 0.15) 0%, transparent 70%);
    pointer-events: none;
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="title">UNDER CONSTRUCTION</div>

<div class="scene">
  <div class="glow"></div>
  <div class="floor"></div>

  <!-- Server Box -->
  <div class="server">
    <div class="server-face server-front">
      <div class="slot">
        <div class="led"></div>
        <div class="led blue"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led"></div>
        <div class="led red"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led off"></div>
        <div class="led off"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led blue"></div>
        <div class="led"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led red"></div>
        <div class="led"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led"></div>
        <div class="led blue"></div>
        <div class="slot-lines"></div>
      </div>
      <div class="slot">
        <div class="led off"></div>
        <div class="led red"></div>
        <div class="slot-lines"></div>
      </div>
    </div>
    <div class="server-face server-back"></div>
    <div class="server-face server-left"></div>
    <div class="server-face server-right"></div>
    <div class="server-face server-top"></div>
    <div class="server-face server-bottom"></div>

    <!-- Broken panel -->
    <div class="broken"></div>
    <div class="wires">
      <div class="wire"></div>
      <div class="wire"></div>
      <div class="wire"></div>
      <div class="wire"></div>
    </div>
    <div class="sparks">
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
    </div>
  </div>

  <!-- Worker 1 -->
  <div class="worker">
    <div class="hat"></div>
    <div class="head"></div>
    <div class="body"></div>
    <div class="arm left"></div>
    <div class="arm right">
      <div class="wrench"></div>
    </div>
    <div class="legs">
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>
  </div>

  <!-- Worker 2 -->
  <div class="worker2">
    <div class="hat"></div>
    <div class="head"></div>
    <div class="body"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="legs">
      <div class="leg left"></div>
      <div class="leg right"></div>
    </div>
  </div>

  <!-- Construction elements -->
  <div class="cone cone1"></div>
  <div class="cone cone2"></div>
  <div class="cone cone3"></div>
  <div class="toolbox"></div>
  <div class="tape"></div>
</div>

<div class="status">SYSTEM REPAIR IN PROGRESS</div>

</body>
</html>
